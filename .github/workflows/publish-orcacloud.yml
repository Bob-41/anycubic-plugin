name: Publish to OrcaCloud

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish, e.g. v0.8.0"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  # Space-separated globs matching the plugin files to upload (.whl / .py).
  # Filenames must end with a supported OS/arch target.
  # linux_x86_64 is the standard target for pure Python plugins (cross-platform).
  PLUGIN_FILES: "dist/anycubic_linux_x86_64.py"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Sync dist artifacts from source
        run: |
          cp plugin/plugin.py dist/anycubic_linux_x86_64.py
          shasum -a 256 dist/anycubic_linux_x86_64.py > dist/anycubic_linux_x86_64.py.sha256
          ls -la dist/

      - name: Publish release to OrcaCloud
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          version="${TAG#v}"
          changelog="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" | head -c 4000)"
          if [ -z "$changelog" ]; then
            changelog="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .body | head -c 4000)"
          fi
          # Write the JSON to a file: curl -F treats ";" inside a literal value
          # as a form-parameter separator and would truncate the changelog.
          jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)' \
            > metadata.json
          jq -e . metadata.json >/dev/null
          args=(-F "metadata=<metadata.json")
          shopt -s nullglob
          for file in $PLUGIN_FILES; do
            args+=(-F "files=@$file")
          done
          if [ "${#args[@]}" -eq 1 ]; then
            echo "No plugin files matched: $PLUGIN_FILES" >&2
            exit 1
          fi
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          [ "$status" = "201" ]
